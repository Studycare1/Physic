const firebaseConfig={apiKey:"AIzaSyB6P7OJz58DEMvtQqe49EArG1TMoE4l0yk",authDomain:"studycare-chemistry.firebaseapp.com",databaseURL:"https://studycare-chemistry-default-rtdb.firebaseio.com",projectId:"studycare-chemistry",storageBucket:"studycare-chemistry.firebasestorage.app",messagingSenderId:"693936311195",appId:"1:693936311195:web:648b62c1f17b3872ffef3e"};

const database=firebase.database();
const DB_BASE=firebaseConfig.databaseURL;

function nowIST(){return new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}
function todayIST(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});}
function durationStr(sec){const m=Math.floor(sec/60),s=sec%60;return m+'m '+s+'s';}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);}

function getDeviceId(){
let id=null;try{id=localStorage.getItem('sc_phy_device_id');}catch(e){}
if(!id){try{id=sessionStorage.getItem('sc_phy_device_id');}catch(e){}}
if(!id){const m=document.cookie.match(/(?:^|;\s*)sc_phy_device_id=([^;]+)/);if(m)id=decodeURIComponent(m[1]);}
if(!id){
const fp=[navigator.userAgent,navigator.language,navigator.platform,navigator.hardwareConcurrency||0,new Date().getTimezoneOffset(),screen.colorDepth,screen.width+'x'+screen.height].join('|');
let hash=0;for(let i=0;i<fp.length;i++)hash=((hash<<5)-hash+fp.charCodeAt(i))|0;
const rand=Math.random().toString(36).slice(2,8).toUpperCase();
const ts=Date.now().toString(36).toUpperCase().slice(-4);
id='PHY_'+Math.abs(hash).toString(36).toUpperCase()+'_'+rand+ts;
try{localStorage.setItem('sc_phy_device_id',id);}catch(e){}
try{sessionStorage.setItem('sc_phy_device_id',id);}catch(e){}
try{document.cookie='sc_phy_device_id='+encodeURIComponent(id)+'; max-age=31536000; path=/; SameSite=Lax';}catch(e){}
}
return id;
}
const deviceId=getDeviceId();
const sessionId='sess_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
const deviceRef=database.ref('devices/'+deviceId);
const sessionRef=database.ref('devices/'+deviceId+'/sessions/'+sessionId);
const infoRef=deviceRef.child('info');

const startTime=new Date();
let isSubmitted=false,score=0;
const attemptedQuestions=new Set();
const userAnswers={};
let userIP="Pending",userLocation="Unknown",deviceDetails="Unknown Device";
let isFirebaseConnected=false,lastRestFallback=0;

function restFallback(path,data){
const now=Date.now();if(now-lastRestFallback<8000)return;lastRestFallback=now;
fetch(DB_BASE+'/devices/'+deviceId+path+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(()=>{});
}

function updateDeviceMeta(extra){
const utmData={};
const params=new URLSearchParams(window.location.search);
['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(k=>{if(params.get(k))utmData[k]=params.get(k);});
if(!utmData.utm_source){utmData.utm_source='direct';utmData.utm_medium='none';}
utmData.capturedAt=nowIST();utmData.capturedDate=todayIST();

const data=Object.assign({
deviceId,ip:userIP,location:userLocation,device:deviceDetails,os:navigator.platform||'Unknown',
ua:navigator.userAgent,screen:screen.width+'x'+screen.height,lang:navigator.language,
utm:utmData,lastSeen:nowIST(),lastSeenTs:Date.now(),online:true
},extra||{});
infoRef.update(data).catch(err=>{restFallback('/info',data);});
return data;
}
updateDeviceMeta();

deviceRef.child('visitCount').transaction(v=>(v||0)+1);
deviceRef.child('info/firstSeen').transaction(v=>v||nowIST());
deviceRef.child('info/online').onDisconnect().set(false);

sessionRef.set({sessionId,startTime:nowIST(),startTimestamp:Date.now(),submitted:false,score:0,attempted:0}).catch(err=>{
restFallback('/sessions/'+sessionId,{sessionId,startTime:nowIST(),startTimestamp:Date.now(),submitted:false,score:0,attempted:0});
});
setInterval(()=>{if(!isSubmitted)updateDeviceMeta();},30000);

withTimeout(fetch('https://ipapi.co/json/').then(r=>r.json()),5000).then(d=>{
userIP=d.ip||"Hidden";userLocation=(d.city||'Unknown')+', '+(d.country_name||'Unknown');
updateDeviceMeta();
}).catch(()=>{userIP="Blocked";updateDeviceMeta();});

async function getDeviceInfo(){
let info=[];
try{
if(navigator.userAgentData){
const h=await withTimeout(navigator.userAgentData.getHighEntropyValues(["model","platform","platformVersion"]),3000);
if(h.model)info.push(h.model);
if(h.platform)info.push((h.platform+' '+(h.platformVersion||'')).trim());
const b=(navigator.userAgentData.brands||[]).find(b=>/Chrome|Edge/.test(b.brand));
if(b)info.push(b.brand);
}
}catch(e){}
if(info.length===0){
if(/Android/.test(navigator.userAgent))info.push("Android");
else if(/iPhone|iPad/.test(navigator.userAgent))info.push("iOS");
else if(/Windows/.test(navigator.userAgent))info.push("Windows");
else if(/Macintosh/.test(navigator.userAgent))info.push("MacOS");
else info.push("Unknown");
}
deviceDetails=info.join(" | ");
updateDeviceMeta();
}
getDeviceInfo();

database.ref('.info/connected').on('value',snap=>{isFirebaseConnected=!!snap.val();});

function selectOption(qId,selectedOpt,correctOpt){
if(isSubmitted)return;
const prevAnswer=userAnswers[qId]||null;
if(prevAnswer){document.getElementById('opt-'+qId+'-'+prevAnswer).classList.remove('selected-ans');}
else{attemptedQuestions.add(qId);}
userAnswers[qId]=selectedOpt;
document.getElementById('opt-'+qId+'-'+selectedOpt).classList.add('selected-ans');
const isCorrect=selectedOpt===correctOpt;
const log={qId,selected:selectedOpt,correct:correctOpt,isCorrect,previous:prevAnswer,isChange:prevAnswer!==null&&prevAnswer!==selectedOpt,timeIST:nowIST(),ts:Date.now()};
sessionRef.child('clicks').push(log).catch(()=>{});
sessionRef.update({attempted:attemptedQuestions.size}).catch(()=>{});
}

function submitTest(){
if(isSubmitted)return;
isSubmitted=true;
let correctCount=0;
mcqData.forEach(item=>{
const userAns=userAnswers[item.id];
const selEl=userAns?document.getElementById('opt-'+item.id+'-'+userAns):null;
const corEl=document.getElementById('opt-'+item.id+'-'+item.ans);
const reasonEl=document.getElementById('reason-'+item.id);
if(userAns){
if(userAns===item.ans){correctCount++;selEl.classList.remove('selected-ans');selEl.classList.add('correct-ans');}
else{selEl.classList.remove('selected-ans');selEl.classList.add('incorrect-ans');corEl.classList.add('correct-ans');}
}else{corEl.classList.add('correct-ans');}
reasonEl.style.display='block';
});
score=correctCount;
lockTest();
const totalQ=mcqData.length,attempted=attemptedQuestions.size,wrong=attempted-score,skipped=totalQ-attempted;
const durationSec=Math.round((Date.now()-startTime)/1000);
document.getElementById('attempted-display').innerText=attempted;
document.getElementById('score-display').innerText=score;
document.getElementById('wrong-display').innerText=wrong;
document.getElementById('skipped-display').innerText=skipped;
document.getElementById('marks-display').innerText=score;
document.getElementById('time-item').style.display='';
document.getElementById('time-display').innerText=durationStr(durationSec);
document.getElementById('results').style.display='block';
showAnswerReview();
const btn=document.getElementById('submit-btn');
btn.innerText='Test Submitted';
btn.style.opacity="0.6";
btn.style.cursor="pointer";
setTimeout(()=>{document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});},50);
sessionRef.update({submitted:true,submitTime:nowIST(),submitTimestamp:Date.now(),durationSeconds:durationSec,durationStr:durationStr(durationSec),score,attempted,wrong,skipped}).catch(()=>{});
deviceRef.child('submitCount').transaction(v=>(v||0)+1);
deviceRef.child('bestScore').transaction(v=>Math.max(v||0,score));
deviceRef.child('lastScore').set(score);
}

function lockTest(){mcqData.forEach(item=>{for(const k in item.options){document.getElementById('opt-'+item.id+'-'+k).style.pointerEvents='none';}});}

function showAnswerReview(){
const list=document.getElementById('review-list');list.innerHTML='';
mcqData.forEach(item=>{
const userAns=userAnswers[item.id]||null;
const status=userAns===null?'skipped':(userAns===item.ans?'correct':'wrong');
const badge={correct:'Correct',wrong:'Wrong',skipped:'Skipped'}[status];
let optsHTML='';
for(const [k,v] of Object.entries(item.options)){
let cls='review-opt';const isUser=k===userAns;const isCorrect=k===item.ans;
if(isCorrect)cls+=' correct-answer';else if(isUser)cls+=' user-wrong';
let tags='';if(isUser)tags+=' <b>← Your Answer</b>';if(isCorrect&&!isUser)tags+=' <b>(Correct)</b>';
optsHTML+='<div class="'+cls+'"><b>('+k+')</b> '+v+tags+'</div>';
}
const card=document.createElement('div');card.className='review-card '+status;
card.innerHTML='<div class="review-q">'+item.id+'. '+item.q+' <span class="status-badge status-'+status+'">'+badge+'</span></div>'+optsHTML+'<div class="review-reason"><b>Reason:</b> '+item.reason+'</div>';
list.appendChild(card);
});
document.getElementById('answer-review').style.display='block';
}

let clickTimestamps=[],submitTimer=null;
function handleSubmitClick(){
var _now=Date.now();clickTimestamps.push(_now);clickTimestamps=clickTimestamps.filter(function(t){return _now-t<=3000;});
if(clickTimestamps.length>=4){clickTimestamps=[];if(submitTimer){clearTimeout(submitTimer);submitTimer=null;}window.open("./admin.html","_blank");return;}
if(!isSubmitted&&!submitTimer){submitTimer=setTimeout(function(){submitTimer=null;if(!isSubmitted)submitTest();},500);}
}
document.getElementById('submit-btn').addEventListener('click',handleSubmitClick);
window.addEventListener('beforeunload',()=>{try{navigator.sendBeacon&&navigator.sendBeacon(DB_BASE+'/devices/'+deviceId+'/info/online.json',JSON.stringify(false));}catch(e){}});
</script>
